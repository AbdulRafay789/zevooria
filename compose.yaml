# Minimal application stack for EC2.
# PostgreSQL remains on AWS RDS — not defined here.
# Nginx / Redis / CloudFront are intentionally omitted.
#
# Runtime DB credentials come from the untracked repo-root .env via env_file.
# Do not bake .env into images (.dockerignore excludes it).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: zevooria-api:local
    ports:
      - "${API_PORT:-3001}:3001"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: zevooria-web:local
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    restart: unless-stopped
